[package]
name = "rockit-sys"
version = "0.1.0"
edition = "2024"
links = "rockit"

[features]
default = ["mpi", "aiq"]
mpi = ["rockit-bindings/mpi"]
aiq = ["rockit-bindings/aiq"]

[dependencies]
rockit-bindings = { path = "../rockit-bindings", default-features = false }

# Fake Rockit library linked instead of the vendored ARM libraries
[target.'cfg(not(target_arch = "arm"))'.dependencies]
rockit-stub = { path = "../rockit-stub" }
