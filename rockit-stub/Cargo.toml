[package]
name = "rockit-stub"
version = "0.1.0"
edition = "2024"
description = "Fake Rockit library implementing a limited subset of the Rockit MPI/AIQ API for non-ARM hosts"

[lib]
name = "rockit"
# rlib: linked statically by rockit-sys on non-ARM targets
# cdylib: a standalone librockit.so for use outside of Rust
crate-type = ["rlib", "cdylib"]

[features]
default = ["clips"]
# Embed pre-encoded H.264/HEVC clips (720p, 1080p) that VENC replays, see clips/
clips = []

[dependencies]
rockit-bindings = { path = "../rockit-bindings" }
